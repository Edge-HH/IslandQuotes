name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 验收与构建
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 .NET SDK 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # verify.ps1 = 静态验收 + Release 构建 + CIPX 打包与包内容检查
      - name: 运行验收脚本
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: 上传 CIPX 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: IslandQuotes-cipx
          path: cipx/IslandQuotes.cipx
          if-no-files-found: error
          retention-days: 14
