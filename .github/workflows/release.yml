name: Release

# 每次发布 Release 时，为该 Release 对应的 tag 重新构建 CIPX，并覆盖其附件。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '为已存在 Release 的 tag（如 1.0.0.0）重新构建并覆盖 CIPX 附件'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并上传 CIPX
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出目标版本
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}

      - name: 安装 .NET SDK 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 校验发布标签
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          # ClassIsland 要求插件版本为 x.x.x.x，tag 必须与 manifest.yml 的 version 完全一致（不带 v 前缀）。
          if ($tag -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Error "标签名 '$tag' 不符合 x.x.x.x 格式（例如 1.0.0.0，不带 v 前缀）。"
            exit 1
          }
          $manifest = Get-Content -LiteralPath 'manifest.yml' -Raw
          $m = [regex]::Match($manifest, '(?m)^\s*version:\s*"?(\d+\.\d+\.\d+\.\d+)"?\s*$')
          if (-not $m.Success) {
            Write-Error '无法从 manifest.yml 读取四段式 version 字段（x.x.x.x）。'
            exit 1
          }
          $expected = $m.Groups[1].Value
          if ($tag -ne $expected) {
            Write-Error "标签 '$tag' 与 manifest.yml 版本 '$($m.Groups[1].Value)' 不一致（期望 '$expected'）。请先同步 manifest.yml 与标签。"
            exit 1
          }
          # 上传前确认该 tag 已有 Release，避免白白构建后才失败。
          gh release view $tag --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "标签 '$tag' 还没有对应的 Release，请先在 GitHub 上发布 Release。"
            exit 1
          }

      # verify.ps1 = 静态验收 + Release 构建 + CIPX 打包与包内容检查，
      # 任一检查失败都不会发布。
      - name: 运行验收脚本并构建 CIPX
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: 生成 SHA256 校验文件
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath 'cipx/IslandQuotes.cipx' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  IslandQuotes.cipx" | Out-File -LiteralPath 'cipx/IslandQuotes.cipx.sha256' -Encoding utf8NoBOM
          Write-Host "SHA256: $hash"

      # --clobber：同名附件已存在时直接覆盖，因此重复发布/重跑都会得到该 tag 的最新 CIPX。
      # 只上传附件，不改动 Release 的标题与说明。
      - name: 上传并覆盖 Release 附件
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload $env:RELEASE_TAG cipx/IslandQuotes.cipx cipx/IslandQuotes.cipx.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
